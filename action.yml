name: "Generate Obsidian Graph"
description: "Parses Markdown files in a repository to generate an Obsidian-style graph."

# You can define inputs if you want them to be configurable by the user
inputs:
  python-version:
    description: "Version of Python to install."
    required: false
    default: "3.x"

runs:
  using: "composite"
  steps:
    - name: Check out repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      run: |
        pip install graphviz
      shell: bash

    - name: Copy graph.py to target repository
      run: |
        cp $GITHUB_ACTION_PATH/graph.py .
      shell: bash
 
    - name: Install graphviz
      run: |
        sudo apt-get update && sudo apt-get install -y graphviz
      shell: bash

    - name: Generate Graph
      run: |
        python graph.py
      shell: bash

    - name: Commit and Push Graph
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions@github.com"
        git add obsidian-graph.png
        if git diff --cached --quiet -- obsidian-graph.png; then
          echo "Obsidian graph is unchanged; skipping commit"
          exit 0
        fi
        git commit -m "Update Obsidian graph" -- obsidian-graph.png
        git push
      shell: bash
